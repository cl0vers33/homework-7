<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>太阳系</title>
  <script src="libs/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- 环境：深空天空盒 -->
    <a-sky color="#02020a"></a-sky>

    <!-- 星空层：星星由脚本均匀撒在球壳上 -->
    <a-entity id="stars"></a-entity>

    <!-- 微弱环境光打底，主照明由第二步的太阳点光源提供 -->
    <a-light type="ambient" color="#8899ff" intensity="0.25"></a-light>

    <!-- 相机初始位：斜上方俯瞰太阳系 -->
    <a-camera position="0 5 10" look-controls wasd-controls></a-camera>
  </a-scene>

  <script>
    // 在半径35~50的球壳上均匀随机撒180颗自发光恒星
    document.querySelector('a-scene').addEventListener('loaded', function () {
      var group = document.getElementById('stars');
      for (var i = 0; i < 180; i++) {
        var star = document.createElement('a-sphere');
        var r = 35 + Math.random() * 15;
        var theta = Math.random() * Math.PI * 2;
        var phi = Math.acos(2 * Math.random() - 1);
        var x = r * Math.sin(phi) * Math.cos(theta);
        var y = r * Math.cos(phi);
        var z = r * Math.sin(phi) * Math.sin(theta);
        star.setAttribute('position', x.toFixed(2) + ' ' + y.toFixed(2) + ' ' + z.toFixed(2));
        star.setAttribute('radius', (0.08 + Math.random() * 0.12).toFixed(2));
        var brightness = (0.5 + Math.random() * 0.5).toFixed(2);
        star.setAttribute('material',
          'shader:standard; color:#000000; emissive:#ffffff; emissiveIntensity:' + brightness);
        group.appendChild(star);
      }
    });
  </script>
</body>
</html>
